<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Контакты — Мария Голубева</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Soyuz Grotesk';
      src: url('fonts/Soyuz_Grotesk_Bold.otf') format('opentype'),
           url('fonts/SoyuzGroteskBold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    @font-face {
      font-family: 'Kom-post';
      src: url('fonts/kom-post.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face { font-family: 'Gilroy'; src: url('fonts/gilroy-regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Gilroy'; src: url('fonts/gilroy-medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Gilroy'; src: url('fonts/gilroy-semibold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Gilroy'; src: url('fonts/gilroy-bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Gilroy', 'Montserrat', Arial, sans-serif;
      background: #fffefb;
      color: #1e1e1c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    :root {
      --black: #1e1e1c;
      --grey1: #d2d2d2;
      --grey2: #a5a5a4;
      --footer-bg: #ece6d6;
      --pad: 40px;
      --max-w: 1280px;
    }

    /* ── NAVBAR ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(255,254,251,.92);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px var(--pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .nav__logo {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-decoration: none;
    }

    .nav__logo-text {
      font-family: 'Kom-post', cursive;
      font-size: 32px;
      font-weight: 400;
      color: #fa472d;
      line-height: 1;
    }

    .nav__logo-sub {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #141414;
      line-height: 1;
    }

    .nav__center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
    }

    .nav__center-link {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #141414;
      text-decoration: none;
      text-transform: uppercase;
      padding: 10px 16px;
      transition: color .2s;
    }

    .nav__center-link:hover { color: #FA472D; }

    .nav__center-link--active {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .nav__resume {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #141414;
      text-decoration: none;
      text-transform: uppercase;
      padding: 10px 16px;
      transition: color .2s;
    }

    .nav__resume:hover { color: #FA472D; }
    .nav__resume:hover svg path { fill: #FA472D; }
    .nav__resume svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ── MOBILE NAV BURGER ── */
    .nav__burger {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }

    .nav__burger-icon { display: block; }
    .nav__burger-icon--close { display: none; }
    .nav__burger.is-active .nav__burger-icon--open { display: none; }
    .nav__burger.is-active .nav__burger-icon--close { display: block; }

    /* ── MOBILE MENU OVERLAY ── */
    .nav__mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(255, 254, 251, .97);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-16px);
      transition: opacity .3s ease, transform .3s ease, visibility 0s .3s;
    }

    .nav__mobile-menu.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: all;
      transform: translateY(0);
      transition: opacity .3s ease, transform .3s ease, visibility 0s 0s;
    }

    .nav__mobile-link {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 32px;
      font-weight: 500;
      color: #141414;
      text-decoration: none;
      text-transform: uppercase;
      padding: 20px 40px;
      line-height: 1;
      transition: color .2s;
    }

    .nav__mobile-link:active { color: #FA472D; }

    .nav__mobile-menu.is-open .nav__mobile-link {
      animation: mobile-link-in .3s ease both;
    }
    .nav__mobile-menu.is-open .nav__mobile-link:nth-child(1) { animation-delay: .06s; }
    .nav__mobile-menu.is-open .nav__mobile-link:nth-child(2) { animation-delay: .12s; }
    .nav__mobile-menu.is-open .nav__mobile-link:nth-child(3) { animation-delay: .18s; }
    .nav__mobile-menu.is-open .nav__mobile-link:nth-child(4) { animation-delay: .24s; }

    @keyframes mobile-link-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MAIN ── */
    .contacts-main {
      flex: 1;
      max-width: var(--max-w); margin: 0 auto; width: 100%;
      padding: 0 var(--pad) 80px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ── LEFT COLUMN ── */
    .contacts-left {
      flex: 1;
      padding-top: 188px;
    }

    .contacts-heading h1 {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 30px; font-weight: 500;
      color: var(--black);
      line-height: 1;
    }

    .contacts-list {
      margin-top: 32px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .contacts-item {
      display: flex; align-items: center; gap: 16px;
    }
    .contacts-item img { width: 24px; height: 24px; flex-shrink: 0; }
    .contacts-item p,
    .contacts-item a.label {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px; font-weight: 500;
      color: var(--black); text-decoration: none;
      line-height: 1;
    }
    .contacts-item a.label {
      color: #141414;
      transition: color 0.2s ease;
    }
    .contacts-item a.label:hover { color: #FA472D; }
    .contacts-item a.tg-link {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px; font-weight: 500;
      color: var(--black);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s ease;
    }
    .contacts-item a.tg-link:hover { color: #FA472D; }
    .contacts-item a.mail-link {
      font-family: 'Inter Tight', Arial, sans-serif;
      font-size: 16px; font-weight: 500;
      color: var(--black);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s ease;
    }
    .contacts-item a.mail-link:hover { color: #FA472D; }

    /* ── PHOTO ── */
    .contacts-photo {
      width: 580px; height: 426px;
      flex-shrink: 0; position: relative;
      margin-top: 177px;
    }
    .contacts-photo__inner {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .contacts-photo img {
      position: absolute;
      height: 106.86%; left: -4%; top: -2.43%; width: 119.36%;
      max-width: none;
    }


    /* ── MOBILE ── */
    @media (max-width: 768px) {
      :root { --pad: 20px; }

      .nav-inner { padding: 12px var(--pad); }
      .nav__logo-text { font-size: 24px; }
      .nav__logo-sub  { font-size: 12px; }
      .nav__center, .nav__resume { display: none; }
      .nav__burger { display: flex; }

      .contacts-main {
        flex-direction: column;
        padding-top: 0;
        padding-bottom: 40px;
        gap: 0;
      }

      .contacts-left {
        flex: none;
        padding-top: 80px;
      }

      .contacts-photo {
        width: 100%;
        height: auto;
        aspect-ratio: 580 / 426;
        margin-top: 24px;
        flex-shrink: 0;
      }

      /* __inner is position:absolute inset:0 — scales with parent aspect-ratio */
      /* img percentage crop scales correctly relative to __inner */
    }

    /* ── REVEAL ── */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .reveal--delay-1 { transition-delay: .15s; }
    .reveal--delay-2 { transition-delay: .30s; }
    .reveal.visible {
      opacity: 1;
      transform: none;
      transition-delay: 0s;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav__logo" href="index.html">
        <span class="nav__logo-text">hey.marie</span>
        <span class="nav__logo-sub">продуктовый | ux/ui дизайнер</span>
      </a>
      <div class="nav__center">
        <a class="nav__center-link" href="index.html#projects">ПРОЕКТЫ</a>
        <a class="nav__center-link" href="about.html">ОБО МНЕ</a>
        <a class="nav__center-link nav__center-link--active" href="contacts.html">КОНТАКТЫ</a>
      </div>
      <a class="nav__resume" href="about.html#resume">
        РЕЗЮМЕ
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.46 14.94L7.45 15.89L13.54 10L7.45 4.11L6.46 5.06L11.57 10Z" fill="#141414"/>
        </svg>
      </a>
      <button class="nav__burger" id="navBurger" aria-label="Открыть меню" aria-expanded="false">
        <svg class="nav__burger-icon nav__burger-icon--open" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7H21M3 12H21M3 17H21" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="nav__burger-icon nav__burger-icon--close" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6L18 18M18 6L6 18" stroke="#141414" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- MOBILE MENU -->
  <div class="nav__mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Навигация">
    <a class="nav__mobile-link" href="index.html#projects">ПРОЕКТЫ</a>
    <a class="nav__mobile-link" href="about.html">ОБО МНЕ</a>
    <a class="nav__mobile-link" href="contacts.html">КОНТАКТЫ</a>
    <a class="nav__mobile-link" href="about.html#resume">РЕЗЮМЕ</a>
  </div>

  <!-- MAIN -->
  <main class="contacts-main">

    <div class="contacts-left">
      <div class="contacts-heading reveal">
        <h1>Контакты</h1>
      </div>

      <div class="contacts-list">
        <div class="contacts-item reveal reveal--delay-1">
          <img src="icons/star.svg" alt="">
          <p>Телеграм:&nbsp;<a class="tg-link" href="https://t.me/mariaagolubeva" target="_blank">@mariaagolubeva</a></p>
        </div>
        <div class="contacts-item reveal reveal--delay-1">
          <img src="icons/star.svg" alt="">
          <p>Почта:&nbsp;<a class="mail-link" href="mailto:mariaa.golubevaa@gmail.com" target="_blank">mariaa.golubevaa@gmail.com</a></p>
        </div>
        <div class="contacts-item reveal reveal--delay-2">
          <img src="icons/star.svg" alt="">
          <a class="label" href="https://hh.ru/resume/279dfc0cff0e5cd9250039ed1f70434c6e7676?print=true" target="_blank">Резюме</a>
        </div>
        <div class="contacts-item reveal reveal--delay-2">
          <img src="icons/star.svg" alt="">
          <p>Линкедин</p>
        </div>
      </div>
    </div>

    <div class="contacts-photo reveal">
      <div class="contacts-photo__inner">
        <img src="assets/images/contacts-photo-maria.png" alt="Мария Голубева">
      </div>
    </div>

  </main>

  <script>
  /* ── MOBILE MENU ── */
  (function () {
    const burger = document.getElementById('navBurger');
    const menu   = document.getElementById('mobileMenu');
    if (!burger || !menu) return;

    function openMenu() {
      menu.classList.add('is-open');
      burger.classList.add('is-active');
      burger.setAttribute('aria-expanded', 'true');
      burger.setAttribute('aria-label', 'Закрыть меню');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menu.classList.remove('is-open');
      burger.classList.remove('is-active');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Открыть меню');
      document.body.style.overflow = '';
    }

    burger.addEventListener('click', () => {
      menu.classList.contains('is-open') ? closeMenu() : openMenu();
    });

    menu.querySelectorAll('.nav__mobile-link').forEach(link => {
      link.addEventListener('click', closeMenu);
    });
  })();

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>

</body>
</html>
